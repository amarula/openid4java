name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      auto_publish:
        description: Publish automatically after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish library and shaded artifact
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          mvn -B -Prelease -Dcentral.autoPublish=${{ inputs.auto_publish }} deploy
          mvn -B -Prelease -Dcentral.autoPublish=${{ inputs.auto_publish }} -f shaded/pom.xml deploy
